<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ZARKHEZ AI — Methodology</title>
    <style>
        :root {
            --green: #84cc16
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            color: #fff
        }

        body {
            min-height: 100vh;
            background: #050b08;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .presentation {
            width: min(100vw, 1600px);
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse at 73% 35%, #17372b 0%, transparent 52%), radial-gradient(ellipse at 9% 92%, #21311b 0%, transparent 43%), #0a0e0a
        }

        .presentation:after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(#8cc69a0c 1px, transparent 1px), linear-gradient(90deg, #8cc69a0c 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: linear-gradient(90deg, transparent, #000 65%, transparent)
        }

        .top {
            height: 9%;
            border-bottom: 1px solid #a9db9b28;
            background: #08140fcf;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3.2%;
            position: relative;
            z-index: 2
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: clamp(9px, 1vw, 15px);
            font-weight: 750;
            line-height: 1.25
        }

        .brandMark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, #d97706, #22c55e);
            font-size: 20px
        }

        .meta {
            text-align: right;
            color: #d7e6df;
            font-size: clamp(9px, .8vw, 12px);
            letter-spacing: .04em
        }

        .meta span {
            display: block;
            color: #a8c0af
        }

        .stage {
            height: 91%;
            padding: 1.5% 3.3% 2.2%;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        .headline h1 {
            margin: 0 0 12px;
            font-size: clamp(24px, 2.6vw, 44px);
            line-height: 1.06;
            letter-spacing: -.04em
        }

        .headline h1 span {
            color: #a8d960
        }

        .diagram {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center
        }

        .diagram img {
            display: block;
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            animation: appear .7s ease-out both;
            background: white
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(9px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media(max-width:700px) {
            body {
                align-items: start
            }

            .presentation {
                aspect-ratio: auto;
                min-height: 100vh
            }

            .top {
                padding: 12px 15px
            }

            .stage {
                height: calc(100vh - 68px);
                padding: 24px 15px
            }

            .headline h1 {
                font-size: 29px
            }

            .diagram img {
                height: auto;
                width: 100%;
                max-height: 100%
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .diagram img {
                animation: none
            }
        }
    </style>
</head>
